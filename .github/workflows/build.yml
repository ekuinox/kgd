name: Build and Push Docker Image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            libclang-dev \
            libde265-dev \
            libx265-dev \
            libaom-dev \
            libwebp-dev \
            zlib1g-dev \
            libjpeg-dev \
            libnuma-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-machete
        run: cargo install cargo-deny cargo-machete

      - name: Install just
        uses: extractions/setup-just@v2

      - name: check source
        run: just ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install aube
        run: npm install -g --ignore-scripts=false @endevco/aube@2.6.1

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Typecheck
        run: aube run --no-install typecheck

      - name: Lint
        run: aube run --no-install lint

      - name: Test
        run: aube run --no-install test

      # Rust の型から作った schema.json と、そこから作る valibot のスキーマがずれていないか確かめる。
      # schema.json 自体のずれは check ジョブの cargo test (api_schema_matches_committed_file) が見つける。
      - name: Check generated API schema is up to date
        run: |
          aube run --no-install gen
          git diff --exit-code -- src/api/schema.gen.ts

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            libclang-dev \
            libde265-dev \
            libx265-dev \
            libaom-dev \
            libwebp-dev \
            zlib1g-dev \
            libjpeg-dev \
            libnuma-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    # master への push が並行すると latest タグの push 順が入れ替わり、
    # 古いコミットのイメージが latest として残ることがあるため直列化する。
    # pull_request では古い run を打ち切って良い。
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          target: ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify version
        run: docker run --rm ${{ env.IMAGE_NAME }}:test --version

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

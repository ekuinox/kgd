services:
  kgd:
    image: ghcr.io/ekuinox/kgd:latest
    container_name: kgd
    restart: unless-stopped
    network_mode: host  # Required for WoL broadcast
    cap_add:
      - NET_RAW  # Required for WoL packets
    volumes:
      - ./config.toml:/app/config.toml:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: kgd-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgd
      POSTGRES_PASSWORD: kgd
      POSTGRES_DB: kgd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgd"]
      interval: 5s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kgd-tunnel
    restart: unless-stopped
    # kgd が WoL のため host ネットワークで待ち受けるので、
    # 同じ名前空間から localhost:8081 へ流す。
    network_mode: host
    # コンテナ既定の nonroot(65532) のまま、グループだけホスト側に合わせる。
    # 認証情報を世界読み取り可にせず、root でも動かさないため。
    # GID はホスト依存なので .env の CLOUDFLARED_GID で指定する。
    user: "65532:${CLOUDFLARED_GID:-1000}"
    # ingress 設定と認証情報はローカルのファイルで持つ。cloudflared tunnel create で
    # 作ったトンネルはダッシュボードから ingress を受け取れず、設定が無いと全ての
    # リクエストに 503 を返すため。protocol も config.yml 側で http2 に固定する
    # (既定の QUIC (UDP 7844) が塞がれているネットワークがあるため)。
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    # 本番でのみ起動する。ローカル開発ではトンネルを張らない。
    profiles:
      - tunnel
    depends_on:
      - kgd

volumes:
  pgdata:
